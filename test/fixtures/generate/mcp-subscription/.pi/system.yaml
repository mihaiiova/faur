schema: 1
name: jared
orchestrator:
  name: lead
  model: openai-codex/gpt-6-sol
  tools: [read, write, edit]
  prompt: You are Jared. Respect the operation request.
mcpServer:
  projectRoot: ../..
  tools: [read]
  env: []
  timeoutMs: 10000
  auth:
    mode: pi-subscription
    provider: openai-codex
    authFileEnv: JARED_PI_AUTH_FILE
  operations:
    - name: audit
      description: Public audit
      inputSchema:
        type: object
        properties:
          request: { type: string }
        required: [request]
        additionalProperties: false
      prompt: audit the project
    - name: review
      description: Public review
      inputSchema:
        type: object
        properties:
          request: { type: string }
        required: [request]
        additionalProperties: false
      prompt: review the project
